<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bombardeo mental · Bohemio Academy</title><style>body{margin:0;background:#0f172a;color:#f8fafc;font:16px system-ui,sans-serif}main{max-width:580px;margin:auto;padding:20px}h1{font-size:28px}section{background:#1e293b;padding:22px;border-radius:22px}label{display:block;margin:18px 0;font-weight:700}input[type=range],select{width:100%;margin-top:10px}select{padding:12px;background:#0f172a;color:white;border-radius:10px}button,.back{display:inline-block;border:0;border-radius:12px;background:#4f46e5;color:white;padding:15px 18px;font-weight:800;cursor:pointer;text-decoration:none}button{margin:5px 3px}#stage{display:none;text-align:center}#frame{aspect-ratio:1;max-width:460px;margin:16px auto;overflow:hidden;border-radius:24px;background:#020617}#picture{width:100%;height:100%;object-fit:cover}#picture.crop{transform:scale(1.28)}small{color:#cbd5e1}a{color:#c4b5fd}</style></head><body><main><a class="back" href="./">← Volver a Academy</a><h1>🧠 Bombardeo mental</h1><p>Reconoce cada escena y recupera mentalmente su número y palabra.</p><section id="setup"><label>Imágenes: <output id="countValue">20</output><input id="count" type="range" min="5" max="100" step="5" value="20"></label><label>Segundos por imagen: <output id="speedValue">1.0</output><input id="speed" type="range" min="0.2" max="5" step="0.1" value="1"></label><label>Orden<select id="order"><option value="random">Aleatorio, sin repetir</option><option value="sequential">Secuencial 00–99</option></select></label><label>Modalidad<select id="mode"><option value="full">Imagen completa</option><option value="memory">Memoria: recorte de rótulos</option></select></label><small>En modo memoria se amplía la zona central de la imagen. Como los rótulos forman parte del dibujo, podrían quedar parcialmente visibles o perderse detalles.</small><p id="duration"></p><button id="start">INICIAR</button></section><section id="stage"><strong id="progress" aria-live="polite"></strong><div id="frame"><img id="picture" alt="Escena del casillero mental"></div><div id="controls"><button id="pause">PAUSAR</button><button id="stop">FINALIZAR</button></div></section></main><script>const $=id=>document.getElementById(id);let seq=[],index=0,timer=null,running=false;function refresh(){ $('countValue').textContent=$('count').value;$('speedValue').textContent=Number($('speed').value).toFixed(1);$('duration').textContent='Duración de exposición: '+(Number($('count').value)*Number($('speed').value)).toFixed(1)+' segundos'}['count','speed'].forEach(id=>$(id).addEventListener('input',refresh));refresh();function show(){if(index>=seq.length){finish(true);return}$('progress').textContent='Imagen '+(index+1)+' de '+seq.length;$('picture').src='images/'+String(seq[index]).padStart(2,'0')+'.webp';$('picture').className=$('mode').value==='memory'?'crop':'';if(running)timer=setTimeout(()=>{index++;show()},Number($('speed').value)*1000)}function finish(done){clearTimeout(timer);running=false;$('pause').textContent='PAUSAR';if(done){$('progress').textContent='Sesión completada: '+seq.length+' imágenes';$('frame').style.display='none';$('pause').style.display='none';$('stop').textContent='NUEVA SESIÓN'}else{$('stage').style.display='none';$('setup').style.display='block';$('frame').style.display='block';$('pause').style.display='inline-block';$('stop').textContent='FINALIZAR'}}$('start').onclick=()=>{seq=Array.from({length:100},(_,i)=>i);if($('order').value==='random')for(let i=99;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}seq=seq.slice(0,Number($('count').value));index=0;running=true;$('setup').style.display='none';$('stage').style.display='block';$('frame').style.display='block';$('pause').style.display='inline-block';$('stop').textContent='FINALIZAR';show()};$('pause').onclick=()=>{if(running){clearTimeout(timer);running=false;$('pause').textContent='CONTINUAR'}else{running=true;$('pause').textContent='PAUSAR';show()}};$('stop').onclick=()=>finish(false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){clearTimeout(timer);running=false;$('pause').textContent='CONTINUAR'}});</script></body></html>
